<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chismes UNAH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>


    <div class="container align-items-center text-center vh-100">
        <h1>Plataforma de Chismes</h1>

        <!--Historial de mensajes-->
        <div id="chat" class="border border-dark rounded p-3 mb-3" style="height: 80vh; overflow-y: scroll;">
            <h1>aqui se veran los mensajes</h1>
        </div>
        <!--Cuadro para redactar mensaje-->
        <form>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="form-field ">
                        <div class="col-10">
                            <label for="fieldTextarea" class="form-label">Message</label>
                            <textarea class="form-control" id="fieldTextarea" rows="3"></textarea>
                        </div>
                        <div class="col-2 d-flex align-items-end">
                             <button type="submit" class="btn-solid theme-primary">Submit</button>
                        </div>                      
                    </div>
                </div>
            </div>
        </form>

    </div>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
