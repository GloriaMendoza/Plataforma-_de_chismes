
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chismes UNAH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-4">
        <h1 class="text-center mb-4">Chismes UNAH</h1>

        <!-- Area de publicaciones -->
        <div id="chat">
            <p id="mensajeInicial" class="text-center text-muted">
                se el primer chismoso
            </p>
        </div>

        <!-- Formulario principal -->
        <form id="formChisme" class="formulario">
            <div class="mb-3">
                <label for="nombre" class="form-label">Usuario</label>
                <input type="text" id="nombre" class="form-control"
                    placeholder="te recomiendo un alias" required>
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label">comencemos a chismear</label>
                <textarea id="mensaje" class="form-control" rows="3"
                    placeholder="¿Qué cuentas?" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Publicar chisme</button>
        </form>
    </div>

    <script src="script.js"></script>

</body>
</html>
